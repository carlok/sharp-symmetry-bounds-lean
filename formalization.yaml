# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Sharp symmetry bounds for real plane algebraic curves (Theorem 1)"
  description: >-
    Let C be an infinite real plane algebraic curve defined by a polynomial of
    degree d >= 2 that is irreducible over the complex numbers, and suppose C
    is not a circle. Its group of Euclidean symmetries is finite, the
    orientation-preserving part is cyclic of order at most max(d, 2d - 4), and
    the full group has order at most 2d. Both bounds are attained in every
    degree d >= 2. For d >= 5, curves attaining the rotation bound are exactly,
    up to orientation-preserving similarity, the curves Re(z^(d-2)(|z|^2 + a)) = 0
    with |a| = 1 and a not real; conversely each such curve with d - 2 >= 3
    attains the bound. This entry formalizes Theorem 1 of the note; the note's
    second theorem (Mobius symmetries and genus of the extremal family) is not
    part of this entry.
  authors:
    - "Carlo Perassi"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Carlo Perassi"

classification:
  arxiv: ["math.AG", "math.MG"]
  msc2020: ["14H50", "14P05", "51N20"]

