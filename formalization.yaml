fidelity:
  divergences: >-
    (1) The plane is identified with C via z = x + iy; a curve is the real zero
    set of a real polynomial f(x, y) that is irreducible after extending
    coefficients to C. (2) Orientation-preserving symmetries are stated as
    isometries of the form z -> az + b with |a| = 1 (equivalent to determinant
    +1 of the linear part; that equivalence is proved in the library, not in the
    Challenge). (3) Cyclicity is stated as: the orientation-preserving symmetries
    are exactly the integer powers of one isometry. (4) Cardinalities use
    Set.ncard, which is 0 for infinite sets; finiteness is stated separately in
    the bound theorem, and the exact counts in the other theorems are positive.
    (5) "Not real" is stated as im(a) != 0. (6) The converse is proved without
    the normalization |a| = 1, a slight strengthening. (7) A symmetry T of C is
    required to satisfy T(z) in C exactly when z in C, i.e. T maps C onto C.

