      - "Frank de Zeeuw"
    id: "arXiv:1308.0177v3"
    location: "https://arxiv.org/abs/1308.0177v3, Lemma 2.6"
    relationship: background
    note: >-
      Uses an auxiliary bound of 4d symmetries; the 2d bound here sharpens that
      constant only, not their distance exponent.
    author_endorsement: not-contacted
  - title: "Symmetries and similarities of planar algebraic curves using harmonic polynomials"
    type: preprint
    authors:
      - "Juan Gerardo Alcázar"
      - "Miroslav Lávička"
      - "Jan Vršek"
    id: "arXiv:1801.09962v1"
    location: "https://arxiv.org/abs/1801.09962v1, Lemma 9"
    relationship: background
    note: >-
      The irreducible quintic Re(z^3(|z|^2 + i)) = 0 has six rotations,
      contradicting the degree restriction in Lemma 9 of this arXiv version.
      A journal article with this title appeared in J. Comput. Appl. Math. 357
      (2019); that version was not inspected and no claim is made about it.
    author_endorsement: not-contacted

